[package]
name = "polyglot-agent-runtime-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Nahian Akhtar"]
license = "MIT"
description = "Zero-allocation cache-line-aligned C11 FFI ring telemetry vault, capability-fenced DAG orchestrator, and O(1) Jain-Chlamtac P2 streaming quantile runtime."
repository = "https://github.com/nahianakhtar/polyglot-agent-runtime-rs"
keywords = ["ffi", "systems", "dag", "telemetry", "quantiles"]
categories = ["concurrency", "algorithms", "data-structures"]

[lib]
name = "polyglot_agent_runtime"
path = "src/lib.rs"

[[bin]]
name = "bench_runtime"
path = "src/bin/bench_runtime.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
